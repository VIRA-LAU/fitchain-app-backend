version: '3.3'
services:
  nestjs-backend:
    image: fitchain-nestjs-backend
    build: .
    ports:
      - 3000:3000
    depends_on:
      - dev-db
      - test-db
  dev-db:
    image: postgres:13
    ports:
      - 5434:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: nest
  test-db:
    image: postgres:13
    ports:
      - 5435:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: nest
